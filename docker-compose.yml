# Use with: podman-compose up
# Or: podman compose up (with podman-compose plugin)
services:
  app:
    image: docker.io/oven/bun:1-debian
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:Z
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -c "bun install && bun run dev"
