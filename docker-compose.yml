# Dev server: podman compose up
services:
  dev:
    image: docker.io/oven/bun:1-debian
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:Z
    working_dir: /app
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -c "bun install && bun run dev"
